[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dual-view"
version = "1.0.0"
description = "dual-view: a unified framework for 2-adic number systems, p-adic Newton dynamics, spectral geometry, gauge theory, and quantum compilation"
readme = "README.md"
license = {text = "MIT"}
authors = []
keywords = ["2-adic", "p-adic", "number-theory", "newton-dynamics", "spectral-geometry", "noncommutative-geometry", "quantum-compilation", "butterfly-compiler", "quantization"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
torch = ["torch>=2.0"]
scipy = ["scipy>=1.10"]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "flake8>=6",
    "mypy>=1",
]

[project.scripts]
dual-view = "dual_view.__main__:main"

[project.urls]
repository = "https://github.com/dual-view/dual-view"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dual_view*"]

[tool.setuptools.package-data]
dual_view = ["newton_dynamics/data/period6_coefficients_full.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["dual_view"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
